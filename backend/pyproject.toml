[project]
name = "connex-backend"
version = "0.1.0"
description = "Secure Chat Backend for ConneX"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "websockets>=12.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "redis>=5.0.1",
    "bcrypt==3.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connex"]
